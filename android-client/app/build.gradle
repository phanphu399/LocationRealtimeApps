plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.locationtracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.locationtracker"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Firebase Bill of Materials (BOM) - quản lý version tự động cho mọi thư viện Firebase
    implementation platform('com.google.firebase:firebase-bom:33.5.1')

    // Firebase Realtime Database: nhận/lưu dữ liệu realtime (path: /devices)
    implementation 'com.google.firebase:firebase-database'

    // Google Play Services Location: FusedLocationProviderClient lấy tọa độ chính xác, tiết kiệm pin
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // AndroidX (UI & runtime cho Activity, theme, permission)
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
}