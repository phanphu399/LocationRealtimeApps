name: Build APK

# Kích hoạt workflow khi có push lên nhánh main
on:
  push:
    branches:
      - main
  workflow_dispatch: # Cho phép chạy tay từ tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Cài đặt Java JDK 17 (bắt buộc cho Android Gradle Plugin 8.x)
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK đã được cài SẴN trên ubuntu-latest (ANDROID_HOME có sẵn).
      #    Chỉ đảm bảo đủ platform-35 + build-tools-35.0.0 cho AGP 8.5 + compileSdk 35.
      #    (KHÔNG dùng android-actions/setup-android@v2 vì action này bị lỗi
      #     "Failed to find package 'tools'" - package đã bị Google gỡ bỏ)
      - name: Verify / install Android SDK packages
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_MANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager=$SDK_MANAGER"
          if [ -n "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
            "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi
          echo "Android SDK ready (AGP sẽ tự tải phần còn thiếu nếu cần)"

      # 4. Cấp quyền thực thi cho gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x ./android-client/gradlew

      # 5. Build APK Debug
      - name: Build debug APK
        working-directory: android-client
        run: ./gradlew assembleDebug

      # 6. Upload APK đầu ra ra dạng Artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationApp-APK
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30