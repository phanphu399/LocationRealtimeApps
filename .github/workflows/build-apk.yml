name: Build APK

# Kích hoạt workflow khi có push lên nhánh main
on:
  push:
    branches:
      - main
  workflow_dispatch: # Cho phép chạy tay từ tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Cài đặt Java JDK 17 (bắt buộc cho Android Gradle Plugin 8.x)
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Cấu hình Android SDK (cmdline-tools, đảm bảo có SDK platform để build)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      # 4. Cấp quyền thực thi cho gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x ./android-client/gradlew

      # 5. Build APK Debug
      - name: Build debug APK
        working-directory: android-client
        run: ./gradlew assembleDebug

      # 6. Upload APK đầu ra ra dạng Artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationApp-APK
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30